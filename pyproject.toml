[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "npl-motionlab"
version = "0.2.0"
description = "Markerless biomechanics measurement, validation, and engineering practice lab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "plotly",
    "pydantic",
    "pyyaml",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "ipykernel",
    "jupyter",
    "pytest",
    "pytest-cov",
]
interactive = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
